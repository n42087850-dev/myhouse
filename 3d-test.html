<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MYHOUSE PRO — Three.js Test</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #0B132B; }
        #canvas-container { width: 100vw; height: 100vh; }
        .info {
            position: absolute; top: 10px; left: 10px; color: #38BDF8;
            font-family: sans-serif; font-size: 14px; background: rgba(0,0,0,0.7);
            padding: 10px 15px; border-radius: 8px; pointer-events: none;
        }
    </style>
</head>
<body>

    <div class="info">
        <b>MYHOUSE PRO — Честный 3D-тест</b><br>
        Крути мышкой или пальцем экран!
    </div>

    <div id="canvas-container"></div>

    <!-- 1. Подключаем сам Three.js -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <!-- 2. Подключаем вращение мышкой/пальцем (OrbitControls) -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script>
        // ШАГ 1: Создаём Сцену, Камеру и Рендерер
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x0B132B);

        const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 2, 4); // Ставим камеру чуть выше и дальше от центра

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.shadowMap.enabled = true; // Включаем честные ТЕНИ!
        container.appendChild(renderer.domElement);

        // Управление вращением мышкой / пальцем
        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // ШАГ 2: Добавляем СВЕТ (Солнце + рассеянный свет)
        const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(3, 5, 2);
        dirLight.castShadow = true; // Этот свет отбрасывает тени
        scene.add(dirLight);

        // ШАГ 3: Рисуем ПОЛ КОМНАТЫ
        const floorGeo = new THREE.PlaneGeometry(4, 4);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0xc89666, roughness: 0.4 }); // Деревянный пол
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2; // Кладем горизонтально
        floor.receiveShadow = true; // Пол принимает тени
        scene.add(floor);

        // ШАГ 4: Рисуем ЗАДНЮЮ СТЕНУ
        const wallGeo = new THREE.PlaneGeometry(4, 2.8);
        const wallMat = new THREE.MeshStandardMaterial({ color: 0xe2e8f0 }); // Светлые обои
        const wall = new THREE.Mesh(wallGeo, wallMat);
        wall.position.set(0, 1.4, -2); // Ставим ровно у заднего края пола
        scene.add(wall);

        // ШАГ 5: Добавляем тестовый ОБЪЁМНЫЙ объект (Симулируем тумбу/куб)
        const boxGeo = new THREE.BoxGeometry(1.2, 0.8, 0.6); // Длина, Высота, Глубина в метрах!
        const boxMat = new THREE.MeshStandardMaterial({ color: 0x38BDF8 });
        const box = new THREE.Mesh(boxGeo, boxMat);
        box.position.set(0, 0.4, -1.7); // Ставим СТРОГО НА ПОЛ у задней стены
        box.castShadow = true; // Объект отбрасывает тень!
        scene.add(box);

        // ШАГ 6: Цикл анимации (перерисовка кадра)
        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
        animate();

        // Подстройка под размер экрана при повороте телефона
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
